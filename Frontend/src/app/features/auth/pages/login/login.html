<main class="auth-page container py-5">
  <div class="card auth-card shadow-sm border-0 mx-auto">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-1 fw-semibold">Sign in</h1>
      <p class="text-body-secondary mb-4">Welcome back to <strong>TaskBoard</strong>.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label">Email</label>
          <input id="login-email" type="email" class="form-control" formControlName="email" autocomplete="username"
                 [class.is-invalid]="invalid('email')" [attr.aria-invalid]="invalid('email')"
                 aria-describedby="login-email-error" />
          @if (invalid('email')) {
            <div id="login-email-error" class="invalid-feedback">
              {{ form.controls.email.hasError('required') ? 'Email is required' : 'Enter a valid email address' }}
            </div>
          }
        </div>

        <div class="mb-4">
          <label for="login-password" class="form-label">Password</label>
          <input id="login-password" type="password" class="form-control" formControlName="password"
                 autocomplete="current-password" [class.is-invalid]="invalid('password')"
                 [attr.aria-invalid]="invalid('password')" aria-describedby="login-password-error" />
          @if (invalid('password')) {
            <div id="login-password-error" class="invalid-feedback">Password is required</div>
          }
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
          @if (submitting()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Signing in…
          } @else {
            Sign in
          }
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        New here? <a routerLink="/register">Create an account</a>
      </p>
    </div>
  </div>
</main>
