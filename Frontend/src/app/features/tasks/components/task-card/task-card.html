<article class="card task-card" [class.task-card--overdue]="task().isOverdue" [class.opacity-75]="pending()"
         role="button" tabindex="0" [attr.aria-label]="'Edit task ' + task().title" [attr.aria-busy]="pending()"
         (click)="opened.emit()" (keydown.enter)="opened.emit()" (keydown.space)="$event.preventDefault(); opened.emit()">
  <div class="card-body p-3">
    <div class="d-flex justify-content-between align-items-start gap-2">
      <h3 class="h6 card-title mb-1 text-break">{{ task().title }}</h3>
      @if (task().isOverdue) {
        <span class="badge rounded-pill text-bg-danger flex-shrink-0">Overdue</span>
      }
    </div>

    @if (task().description) {
      <p class="card-text small text-body-secondary task-card__description mb-2">{{ task().description }}</p>
    }

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
      <small class="text-nowrap" [class.text-danger]="task().isOverdue" [class.text-body-secondary]="!task().isOverdue">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" class="me-1 align-text-top">
          <path d="M4 .5a.5.5 0 0 0-1 0V1H2a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-1V.5a.5.5 0 0 0-1 0V1H4zM1 5h14v9a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1z"/>
        </svg>
        <span class="visually-hidden">Due </span>
        <time [attr.datetime]="task().dueDateUtc">{{ task().dueDateLocal | localDateTime }}</time>
      </small>

      <!-- Controls must not open the edit modal or start a drag. -->
      <div class="d-flex align-items-center gap-1" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()"
           (mousedown)="$event.stopPropagation()" (touchstart)="$event.stopPropagation()">
        <select class="form-select form-select-sm task-card__status" [value]="task().status" [disabled]="pending()"
                [attr.aria-label]="'Move ' + task().title + ' to column'" (change)="changeStatus($event)">
          @for (column of statuses; track column.status) {
            <option [value]="column.status" [selected]="column.status === task().status">{{ column.title }}</option>
          }
        </select>
        <button type="button" class="btn btn-sm btn-outline-danger" [disabled]="pending()"
                [attr.aria-label]="'Delete task ' + task().title" (click)="deleteRequested.emit()">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</article>
